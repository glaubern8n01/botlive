name: Shop LIVE CI
on:
  push:
    branches: [main, codex/shop-live-media-local]
    paths: ["botlive-shop/**", "dashboard/**", ".github/workflows/shop-live-ci.yml"]
  pull_request:
    paths: ["botlive-shop/**", "dashboard/**", ".github/workflows/shop-live-ci.yml"]
jobs:
  shop-live-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install backend dependencies
        working-directory: botlive-shop/apps/local-agent
        run: pip install -r requirements-dev.txt
      - name: Test Alembic on a clean database
        working-directory: botlive-shop/apps/local-agent
        env: {SHOP_LIVE_TESTING: "true", SHOP_LIVE_TEST_DATA_ROOT: "/tmp/shop-live-ci"}
        run: alembic upgrade head
      - name: Run Shop LIVE tests
        working-directory: botlive-shop
        run: python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: TypeScript
        working-directory: dashboard
        run: npm run lint
      - name: Build production dashboard for browser tests
        working-directory: dashboard
        env: {VITE_SHOP_LIVE_ENABLED: "true"}
        run: npm run build
      - name: Validate Chrome extension scripts
        working-directory: botlive-shop/apps/extension
        run: node --check service-worker.js && node --check content-script.js && node --check sidepanel.js
      - name: Install extension browser test
        working-directory: botlive-shop/apps/extension
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run extension in Chromium
        working-directory: botlive-shop/apps/extension
        env: {SHOP_LIVE_TEST_PYTHON: python}
        run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: shop-live-sidepanel, path: botlive-shop/apps/extension/test-results/sidepanel-operando.png, if-no-files-found: warn}
      - name: Build with Shop LIVE disabled
        working-directory: dashboard
        env: {VITE_SHOP_LIVE_ENABLED: "false"}
        run: npm run build
      - name: Build with Shop LIVE enabled
        working-directory: dashboard
        env: {VITE_SHOP_LIVE_ENABLED: "true"}
        run: npm run build
  shop-live-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install backend dependencies
        working-directory: botlive-shop/apps/local-agent
        run: python -m pip install -r requirements-dev.txt
      - name: Alembic incremental schema
        working-directory: botlive-shop/apps/local-agent
        env: {SHOP_LIVE_TESTING: "true", SHOP_LIVE_TEST_DATA_ROOT: "${{ runner.temp }}/shop-live-ci"}
        run: python -m alembic upgrade head
      - name: Python tests
        working-directory: botlive-shop
        run: python -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - name: TypeScript and builds
        working-directory: dashboard
        shell: pwsh
        run: |
          npm ci
          npm run lint
          $env:VITE_SHOP_LIVE_ENABLED='false'; npm run build
          $env:VITE_SHOP_LIVE_ENABLED='true'; npm run build
      - name: PowerShell syntax and extension syntax
        shell: pwsh
        run: |
          Get-ChildItem botlive-shop/scripts/*.ps1 | ForEach-Object { [void][scriptblock]::Create((Get-Content -Raw $_.FullName)) }
          node --check botlive-shop/apps/extension/service-worker.js
          node --check botlive-shop/apps/extension/content-script.js
          node --check botlive-shop/apps/extension/sidepanel.js
      - name: Clean Windows install and production smoke test
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          botlive-shop/scripts/Test-CleanInstall-ShopLive.ps1
