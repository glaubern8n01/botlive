server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads do modulo de importacao/commerce passam por aqui.
    client_max_body_size 512m;

    # Resolver do Docker Swarm com variavel: sem isto o nginx se recusa a
    # subir quando o servico de agentes ainda nao existe, e o painel inteiro
    # cairia junto.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agentes botlive_agents;

    # Os agentes ficam no MESMO dominio de proposito: herdam o Basic Auth do
    # Traefik, nao abrem porta publica nova e o navegador nao precisa de CORS.
    location /vexpublish/ {
        proxy_pass http://$agentes:8785;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /import/ {
        proxy_pass http://$agentes:8795;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location /commerce/ {
        proxy_pass http://$agentes:8805;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / { try_files $uri /index.html; }
}
